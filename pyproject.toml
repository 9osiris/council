[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "council"
version = "1.2.0"
description = "multi-agent orchestration for openai-compatible apis: debate, vote, supervise, pipeline, fanout"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "9osiris" }]

[project.scripts]
council = "council.cli:main"

[tool.setuptools.packages.find]
include = ["council*"]
